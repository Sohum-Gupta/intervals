name: Intervals
options:
  bundleIdPrefix: com.sohum
  deploymentTarget:
    macOS: "26.5"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.5"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: SQH2L2PNM9
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Intervals:
    type: application
    platform: macOS
    sources:
      - path: Intervals
    info:
      path: Intervals/Info.plist
      properties:
        CFBundleName: Intervals
        CFBundleDisplayName: Intervals
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 Sohum"
    entitlements:
      path: Intervals/Intervals.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sohum.intervals
        PRODUCT_NAME: Intervals
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  IntervalsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: IntervalsTests
    dependencies:
      - target: Intervals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sohum.intervals.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Intervals.app/Contents/MacOS/Intervals"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Intervals:
    build:
      targets:
        Intervals: all
        IntervalsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IntervalsTests
      gatherCoverageData: false
    archive:
      config: Release
